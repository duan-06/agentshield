# Llama Shield - Kubernetes Deployment
# 使用: kubectl apply -f k8s/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-shield
  namespace: llama-shield
  labels:
    app: llama-shield
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llama-shield
  template:
    metadata:
      labels:
        app: llama-shield
        version: v1
    spec:
      serviceAccountName: llama-shield

      # 亲和性配置
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: gpu
                operator: In
                values:
                - "true"

      # 容器配置
      containers:
      - name: llama-shield
        image: llama-shield:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP

        # 环境变量
        env:
        - name: APP_NAME
          value: "LlamaShield"
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: llama-shield-config
              key: postgres_host
        - name: POSTGRES_PORT
          value: "5432"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: llama-shield-config
              key: redis_host
        - name: VLLM_HOST
          value: "vllm-service"
        - name: LLAMAFIREWALL_MODE
          value: "strict"
        - name: LLAMAFIREWALL_BLOCK_THRESHOLD
          value: "0.8"

        # 资源限制（适配 RTX 4060 Laptop 显存优化）
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"

        # 健康检查
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # 卷挂载
        volumeMounts:
        - name: app-config
          mountPath: /app/config
          readOnly: true
        - name: app-logs
          mountPath: /app/logs

      # 卷
      volumes:
      - name: app-config
        configMap:
          name: llama-shield-config
      - name: app-logs
        emptyDir: {}

      # 容忍
      tolerations:
      - key: "gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-shield-config
  namespace: llama-shield
data:
  postgres_host: "postgres-service"
  redis_host: "redis-service"
  policy_path: "/app/config/policy.yaml"

---
# Secret (应使用外部密钥管理)
apiVersion: v1
kind: Secret
metadata:
  name: llama-shield-secret
  namespace: llama-shield
type: Opaque
stringData:
  postgres_password: "change-me-in-production"
  redis_password: ""
  jwt_secret: "your-secret-key-change-in-production"
